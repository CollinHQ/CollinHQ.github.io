    <!-- GitHub Pages SPA redirect handler — pairs with public/404.html -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        var h = params.get('h');
        if (p) {
          var url = decodeURIComponent(p) + (h ? decodeURIComponent(h) : '');
          window.history.replaceState(null, null, url);
        }
      })();
    </script>
